      saveHighScore(G.highScore);
    }
    updateHUD();
    var newHigh = G.score > G.startHighScore;
    G.overNewHigh = newHigh;
    finalScoreEl.textContent = '0';
    finalHighEl.textContent = G.highScore;
    if (newHighRowEl) newHighRowEl.classList.toggle('hidden', !newHigh);
    if (FX.canvas) FX.canvas.style.zIndex = '120';
    BG.active = false;
    stopBgm();
    playSfx('gameover');
    // 盤面崩壊演出を先に行い、オーバーレイ表示だけ約1.2秒遅らせる
    triggerGameOverFx();
    G.overOverlayPending = true;
    FX.timers.push({ t: 1.2, fn: showOverOverlay });
    requestFrame();
  }

  /* =========================================================
     メインループ(1本の requestAnimationFrame)
  ========================================================= */
  var rafId = null;
  var lastT = 0;

  function loopNeeded() {
    if (!document.hidden && G.state === 'playing') return true;
    if (FX.particles.length || FX.rings.length || FX.pops.length || FX.banners.length || FX.clears.length || FX.timers.length) return true;
    if (FX.rockets.length || FX.fireworks.length || FX.confetti.length) return true;
    if (FX.shakeT > 0 || FX.flash || FX.overVignette || overScoreActive) return true;
    return false;
  }

  function requestFrame() {
    if (rafId === null && !document.hidden) rafId = window.requestAnimationFrame(tick);
  }

  function tick(now) {
    rafId = null;
    var dt = lastT ? (now - lastT) / 1000 : 0.016;
    lastT = now;
    if (dt > 0.05) dt = 0.05;
    if (dt < 0) dt = 0;

    if (BG.active) { updateBg(dt); drawBg(); }
    updateFx(dt);
    drawFx();
    updateScoreCount(dt);
    updateOverScoreCount(dt);

    if (loopNeeded()) requestFrame();
    else if (FX.ctx) FX.ctx.clearRect(0, 0, FX.w, FX.h);
  }

  /* =========================================================
     iOS Safari 音声アンロック
  ========================================================= */
  function playSilent() {
    try {
      if (!G.audio) return;
      var ac = G.audio;
      var b = ac.createBuffer(1, 1, ac.sampleRate || 44100);
      var s = ac.createBufferSource();
      s.buffer = b;
      s.connect(ac.destination);
      s.start();
    } catch (e) { /* ignore */ }
  }

  function unlockAudio() {
    ensureAudio();
    try {
      if (G.audio && G.audio.state === 'suspended' && G.audio.resume) {
        var pr = G.audio.resume();
        if (pr && pr.catch) pr.catch(function () {});
      }
    } catch (e) { /* ignore */ }
    playSilent();
  }

  /* =========================================================
     初期化
  ========================================================= */
  function init() {
    buildBoard();
    buildTray();
    computeLayout();
    resizeFx();
    resizeBg();
    buildGlows();
    if (!BG.particles.length) initBgParticles();

    G.highScore = loadHighScore();
    G.muted = loadPref(MUTE_KEY, false);
    bgmOn = loadPref(BGM_KEY, true);
    muteBtn.textContent = G.muted ? '🔇' : '🔊';
    bgmBtn.textContent = bgmOn ? '🎵' : 'BGM off';

    renderBoard();
    renderTray();
    updateHUD();
    showScreen('title');

    window.addEventListener('resize', function () {
      computeLayout();
      resizeFx();
      resizeBg();
      renderBoard();
      renderTray();
      requestFrame();
    });

    document.getElementById('startBtn').addEventListener('click', function () { ensureAudio(); unlockAudio(); start(); });
    document.getElementById('resumeBtn').addEventListener('click', function () { resume(); });
    document.getElementById('restartBtn').addEventListener('click', function () { restart(); });
    document.getElementById('retryBtn').addEventListener('click', function () { restart(); });
    pauseBtn.addEventListener('click', function () {
      if (G.state === 'playing') pause();
      else if (G.state === 'paused') resume();
    });
    muteBtn.addEventListener('click', function () {
      G.muted = !G.muted;
      muteBtn.textContent = G.muted ? '🔇' : '🔊';
      savePref(MUTE_KEY, G.muted);
      try { if (masterGain) masterGain.gain.value = G.muted ? 0 : 1; } catch (e) { /* ignore */ }
      if (!G.muted) { ensureAudio(); playSfx('pickup'); }
    });
    bgmBtn.addEventListener('click', function () { setBgmOn(!bgmOn); });

    // 最初のユーザー操作で AudioContext を有効化 + アンロック
    window.addEventListener('pointerdown', function () { unlockAudio(); }, { once: true });

    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        if (rafId !== null) { window.cancelAnimationFrame(rafId); rafId = null; }
      } else {
        lastT = 0;
        if (loopNeeded()) requestFrame();
      }
    });
  }

  /* =========================================================
     自動テスト用 API
  ========================================================= */
  window.__game = {
    get state() { return G.state; },
    get score() { return G.score; },
    get highScore() { return G.highScore; },
    get combo() { return G.combo; },
    get board() { return G.board; },
    get pieces() { return G.pieces; },

    start: function () { start(); },
    restart: function () { restart(); },

    place: function (pieceIndex, row, col) {
      return tryPlace(pieceIndex, row, col);
    },
    canPlace: function (pieceIndex, row, col) {
      return canPlacePiece(pieceIndex, row, col);
    },

    setBoard: function (board2d) {
      if (!board2d) return;
      var nb = emptyBoard();
      for (var r = 0; r < SIZE; r++) {
        for (var c = 0; c < SIZE; c++) {
          if (board2d[r] && typeof board2d[r][c] !== 'undefined') nb[r][c] = board2d[r][c];
        }
      }
      G.board = nb;
      renderBoard();
    },

    setPieces: function (list) {
      var arr = Array.isArray(list) ? list : [];
      var out = [];
      for (var i = 0; i < 3; i++) {
        var cells = arr[i];
        if (!cells) { out.push(null); continue; }
        var clean = [];
        for (var j = 0; j < cells.length; j++) clean.push([cells[j][0], cells[j][1]]);
        out.push({ cells: clean, color: PALETTE[(i * 3 + 1) % PALETTE.length] });
      }
      G.pieces = out;
      renderTray();
    },

    pause: function () { pause(); },
    resume: function () { resume(); },

    isGameOver: function () { return isGameOverInternal(); },

    get fxState() {
      var banners = [];
      for (var i = 0; i < FX.banners.length; i++) banners.push(FX.banners[i].text);
      return {
        particles: FX.particles.length,
        firework: FX.fireworks.length,
        confetti: FX.confetti.length,
        banner: banners,
        overlayDelayed: !!G.overOverlayPending
      };
    }
  };

  window.__audio = {
    get loaded() {
      var o = {}, k;
      for (k in soundLoaded) if (Object.prototype.hasOwnProperty.call(soundLoaded, k)) o[k] = !!soundLoaded[k];
      for (k in bgmLoaded) if (Object.prototype.hasOwnProperty.call(bgmLoaded, k)) o[k] = !!bgmLoaded[k];
      return o;
    },
    get muted() { return G.muted; },
    get bgmOn() { return bgmOn; },
    get played() { return played.slice(); }
  };

  init();
})();
</script>
</body>
</html>
